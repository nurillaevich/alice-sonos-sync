blueprint:
  name: "Alice ⏹ → Sonos | Smooth Stop & Restore"
  description: >
    Alice (Yandex Station) da musiqa to'xtaganda (paused / idle / standby / off),
    Sonos (Music Assistant) ovozi yumshoq pasayadi va pauza qilinadi, keyin
    Sonos ovozi pasayishdan oldingi darajaga qaytariladi (Sonos ilovasidan
    keyingi ijro 1% dan boshlanmasligi uchun), Alice ovozi esa belgilangan
    darajaga (masalan 50%) qaytariladi.

    Bu blueprint "Smooth Handoff (Start)" bilan juft bo'lib ishlaydi:
    Start Alice ovozini 0 ga tushiradi, Stop esa uni qayta tiklaydi.
  domain: automation
  homeassistant:
    min_version: 2024.10.0
  source_url: https://github.com/nurillaevich/alice-sonos-sync/blob/main/blueprints/automation/alice_sonos/alice_sonos_smooth_stop.yaml
  input:
    players:
      name: "🔊 Speakerlar / Players"
      icon: mdi:speaker-multiple
      input:
        alice_player:
          name: "Alice (Yandex Station)"
          description: "Start blueprintdagi BIR XIL Alice entity'sini tanlang."
          selector:
            entity:
              filter:
                - domain: media_player
                  integration: yandex_station
        sonos_player:
          name: "Sonos (Music Assistant)"
          description: "Start blueprintdagi BIR XIL Sonos entity'sini tanlang."
          selector:
            entity:
              filter:
                - domain: media_player
                  integration: music_assistant
    options:
      name: "🎚 Sozlamalar / Options"
      icon: mdi:tune-vertical
      input:
        sonos_fade_floor:
          name: "Sonos pasayish chegarasi"
          description: "Pauzadan oldin Sonos shu darajagacha tushadi. 0.01 ≈ jim."
          default: 0.01
          selector:
            number: { min: 0, max: 1, step: 0.01, mode: slider }
        restore_sonos_volume:
          name: "Pauzadan keyin Sonos ovozini qaytarish"
          description: >
            Yoqilgan bo'lsa, Sonos pauza bo'lgach ovozi pasayishdan oldingi
            darajaga qaytariladi. O'chirilsa, Sonos pasayish chegarasida qoladi.
          default: true
          selector:
            boolean: {}
        alice_restore_volume:
          name: "Alice qaytariladigan ovoz"
          description: "To'xtagandan keyin Alice shu darajaga qaytadi (masalan 0.5 = 50%)."
          default: 0.5
          selector:
            number: { min: 0, max: 1, step: 0.01, mode: slider }
        steps:
          name: "Pasayish qadamlari soni"
          description: "Ko'p = silliqroq, kam = tezroq."
          default: 10
          selector:
            number: { min: 1, max: 40, step: 1, mode: box }
        step_delay_ms:
          name: "Har qadam orasidagi kutish (ms)"
          default: 200
          selector:
            number: { min: 0, max: 1000, step: 10, unit_of_measurement: ms, mode: box }

mode: restart
max_exceeded: silent

variables:
  alice_player: !input alice_player
  sonos_player: !input sonos_player
  sonos_fade_floor: !input sonos_fade_floor
  restore_sonos_volume: !input restore_sonos_volume
  alice_restore_volume: !input alice_restore_volume
  steps: !input steps
  step_delay_ms: !input step_delay_ms

triggers:
  - trigger: state
    entity_id: !input alice_player
    from: playing
    to:
      - idle
      - paused
      - standby
      - "off"

# Shartlar: (1) Sonos haqiqatan chalayotgan bo'lsin (handoff bo'lgan deb
# taxmin qilamiz) — aks holda Sonos'dagi mustaqil ijroni pauza qilib,
# Alice ovozini bekorga o'zgartirib yuboramiz; (2) Alice'da aynan MUSIQA
# to'xtagan bo'lsin — ovozli javob, yangilik yoki budilnik tugaganda emas
# (Start blueprintdagi musiqa sharti bilan juftlik).
conditions:
  - condition: template
    value_template: "{{ is_state(sonos_player, 'playing') }}"
  - condition: template
    value_template: >
      {{ (trigger.from_state.attributes.media_content_type | default('')) == 'music' }}

actions:
  - variables:
      sonos_start_volume: "{{ state_attr(sonos_player, 'volume_level') | float(0.25) }}"

  # 1) Sonos ovozini joriy darajadan floor gacha yumshoq tushiramiz.
  - repeat:
      count: "{{ steps | int }}"
      sequence:
        - action: media_player.volume_set
          target:
            entity_id: !input sonos_player
          data:
            volume_level: >
              {% set start = sonos_start_volume | float(0.25) %}
              {% set finish = sonos_fade_floor | float(0.01) %}
              {% set n = steps | int %}
              {{ [finish, start - ((start - finish) / n * repeat.index)] | max | round(3) }}
        - delay: "{{ (step_delay_ms | int) / 1000 }}"

  # 2) Sonos'ni pauza qilamiz.
  - action: media_player.media_pause
    target:
      entity_id: !input sonos_player

  # 3) Sonos pauza bo'lgach (faqat shunda — aks holda musiqa yana baland
  #    chiqib ketadi), ovozini pasayishdan oldingi darajaga qaytaramiz.
  - if:
      - condition: template
        value_template: "{{ restore_sonos_volume }}"
    then:
      - wait_template: "{{ not is_state(sonos_player, 'playing') }}"
        timeout: 3
        continue_on_timeout: true
      - if:
          - condition: template
            value_template: "{{ not is_state(sonos_player, 'playing') }}"
        then:
          - action: media_player.volume_set
            target:
              entity_id: !input sonos_player
            data:
              volume_level: "{{ sonos_start_volume | float(0.25) }}"

  # 4) Alice ovozini qayta tiklaymiz.
  - action: media_player.volume_set
    target:
      entity_id: !input alice_player
    data:
      volume_level: "{{ alice_restore_volume | float(0.5) }}"
