# Namuna Stop avtomatikasi (blueprintsiz) — AVVAL ikkala media_player entity
# ID'sini O'ZINGIZNIKIGA almashtiring.
#
# DIQQAT: Alice entity'si bu faylda 2 joyda uchraydi (variables + trigger).
# Triggerlar variables blokidan foydalana OLMAYDI — faqat variables'ni
# o'zgartirsangiz, trigger eski entity'da qolib, avtomatika ishga tushmaydi.

alias: "Alice stop -> Sonos | Smooth Stop & Restore (filled)"
description: >-
  Alice'da musiqa to'xtasa, Sonos yumshoq pasayadi va pauza bo'ladi,
  Sonos ovozi avvalgi darajaga, Alice ovozi 50% ga qaytadi.
mode: restart
max_exceeded: silent

variables:
  alice_player: media_player.YOUR_YANDEX_STATION
  sonos_player: media_player.YOUR_SONOS_MA_PLAYER
  sonos_fade_floor: 0.01
  alice_restore_volume: 0.5
  steps: 10
  step_delay_ms: 200

triggers:
  - trigger: state
    entity_id: media_player.YOUR_YANDEX_STATION
    from: playing
    to:
      - idle
      - paused
      - standby
      - "off"

# (1) Sonos haqiqatan chalayotgan bo'lsin; (2) Alice'da aynan MUSIQA
# to'xtagan bo'lsin (ovozli javob/yangilik/budilnik emas).
conditions:
  - condition: template
    value_template: "{{ is_state(sonos_player, 'playing') }}"
  - condition: template
    value_template: >
      {{ (trigger.from_state.attributes.media_content_type | default('')) == 'music' }}

actions:
  - variables:
      sonos_start_volume: "{{ state_attr(sonos_player, 'volume_level') | float(0.25) }}"

  - repeat:
      count: "{{ steps | int }}"
      sequence:
        - action: media_player.volume_set
          target:
            entity_id: "{{ sonos_player }}"
          data:
            volume_level: >
              {% set start = sonos_start_volume | float(0.25) %}
              {% set finish = sonos_fade_floor | float(0.01) %}
              {% set n = steps | int %}
              {{ [finish, start - ((start - finish) / n * repeat.index)] | max | round(3) }}
        - delay: "{{ (step_delay_ms | int) / 1000 }}"

  - action: media_player.media_pause
    target:
      entity_id: "{{ sonos_player }}"

  # Sonos pauza bo'lgach, ovozini pasayishdan oldingi darajaga qaytaramiz
  # (Sonos ilovasidan keyingi ijro 1% dan boshlanmasin).
  - wait_template: "{{ not is_state(sonos_player, 'playing') }}"
    timeout: 3
    continue_on_timeout: true
  - if:
      - condition: template
        value_template: "{{ not is_state(sonos_player, 'playing') }}"
    then:
      - action: media_player.volume_set
        target:
          entity_id: "{{ sonos_player }}"
        data:
          volume_level: "{{ sonos_start_volume | float(0.25) }}"

  - action: media_player.volume_set
    target:
      entity_id: "{{ alice_player }}"
    data:
      volume_level: "{{ alice_restore_volume | float(0.5) }}"
